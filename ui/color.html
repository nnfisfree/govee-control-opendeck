<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Color</title>
		<link rel="stylesheet" href="style.css" />
		<script src="common.js"></script>
	</head>
	<body>
		<section id="account"></section>
		<section id="devices"></section>
		<section>
			<h2>Colour</h2>
			<div class="row">
				<label for="color">Colour</label>
				<div class="inline">
					<input id="color" type="color" data-setting="color" />
					<output data-for="color"></output>
				</div>
			</div>
			<div class="row">
				<label>Presets</label>
				<div class="inline" id="presets"></div>
			</div>
			<p class="hint" data-controller="Keypad">Press the key to apply this colour.</p>
		</section>
		<section data-controller="Encoder">
			<h2>Dial</h2>
			<div class="row">
				<label for="dial-mode">Turning</label>
				<select id="dial-mode" data-setting="dialMode">
					<option value="hue">Shifts the hue</option>
					<option value="list">Steps through a list</option>
				</select>
			</div>
			<div class="row" data-show-if="dialMode:hue">
				<label for="dial-step">Hue per tick</label>
				<input id="dial-step" type="number" min="1" max="90" data-setting="dialStep" />
			</div>
			<div class="row top" data-show-if="dialMode:list">
				<label for="dial-colors">Colours</label>
				<textarea id="dial-colors" data-setting="dialColors" spellcheck="false"></textarea>
			</div>
			<p class="hint" data-show-if="dialMode:list">Colours like #ff0000, separated by commas or new lines.</p>
			<p class="hint">Press or tap to toggle power.</p>
		</section>
		<script>
			const PRESETS = ["#ff0000", "#ff8800", "#ffd60a", "#30d158", "#00c7be", "#0a84ff", "#5e5ce6", "#ff2d92", "#ffffff"];
			const presetBox = document.getElementById("presets");
			const colorInput = document.getElementById("color");
			for (const hex of PRESETS) {
				const swatch = document.createElement("button");
				swatch.title = hex;
				swatch.style.cssText = `width:18px;height:18px;padding:0;border-radius:50%;background:${hex}`;
				swatch.addEventListener("click", () => {
					colorInput.value = hex;
					colorInput.dispatchEvent(new Event("change"));
				});
				presetBox.append(swatch);
			}
			GoveePI.start({
				feature: "rgb",
				defaults: {
					devices: [],
					color: "#ff8800",
					dialStep: 10,
					dialMode: "hue",
					dialColors: "#ff0000, #ff8800, #ffd60a, #30d158, #00c7be, #0a84ff, #5e5ce6, #ff2d92, #ffffff",
				},
			});
		</script>
	</body>
</html>
